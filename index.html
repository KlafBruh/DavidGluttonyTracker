<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4B TRACKER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0f0f0f;--ink:#f4f4f2;--mute:#9a9a96;--line:#262626;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center;margin-bottom:30px}
h1{margin:0;font-size:clamp(44px,10vw,96px);font-weight:800;letter-spacing:.04em;line-height:1}
h1 span{color:#b6ff00;background:linear-gradient(90deg,#b6ff00,#ff7a1a 55%,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mute);margin:10px 0 0;font-size:clamp(14px,2.4vw,18px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.cards{grid-template-columns:1fr;max-width:480px;margin:0 auto}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:22px 18px 22px;text-align:center;transition:border-color .3s,box-shadow .3s}
.card.go{border-color:var(--acc);box-shadow:0 0 50px color-mix(in srgb,var(--acc) 22%,transparent)}
.stage svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
h2{margin:6px 0 0;font-size:26px;font-weight:800}
.card p{margin:2px 0 16px;color:var(--mute);font-size:14px}
.btn{display:inline-block;background:var(--acc);color:#0a0a0a;font-weight:800;font-size:16px;text-decoration:none;padding:12px 22px;border-radius:99px;transition:transform .2s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px) scale(1.03)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.prog{stroke:var(--acc);stroke-dasharray:1055.6;stroke-dashoffset:1055.6;transition:stroke-dashoffset 1.1s ease}
.go .prog{stroke-dashoffset:300}
.fig,.gfig{transform-origin:200px 345px}
.sk{fill:#b98458}.sh{fill:#f3f6ee}.hr{fill:#120d0b}

/* idle */
@keyframes davidIdle{0%,100%{transform:scale(.92,.96)}50%{transform:scale(.935,.945)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.98)}}
.david{animation:davidIdle 3.4s ease-in-out infinite}
.smoker,.gfig{animation:breathe 3.2s ease-in-out infinite}
.gfig:nth-of-type(2){animation-delay:-1.2s}

/* David grows */
@keyframes grow{from{transform:scale(.92,.96)}to{transform:scale(1.55,1.14)}}
.go .david{animation:grow 1.7s cubic-bezier(.34,1.56,.64,1) infinite alternate}

/* smoker puffs and turns green */
.puff{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.65}100%{transform:translate(26px,-90px) scale(2.8);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes sick{0%,100%{fill:#b98458}50%{fill:#98bd78}}
.go .puff{animation:rise 1.8s ease-out infinite}
.go .smoker{animation:sway 1.6s ease-in-out infinite}
.go .smoker .sk{animation:sick 1.8s ease-in-out infinite}

/* gamblers slump, shake and sweat */
@keyframes slump{0%,100%{transform:scale(1,1) translateX(0)}20%{transform:scale(1,.86)}40%{transform:scale(1,.86) translateX(-3px)}55%{transform:scale(1,.86) translateX(3px)}70%{transform:scale(1,.86) translateX(-2px)}85%{transform:scale(1,.9) translateX(0)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(46px);opacity:0}}
.drop{opacity:0;transform-box:fill-box}
.m-frown{display:none}
.go .gfig{animation:slump 1.5s ease-in-out infinite}
.go .drop{animation:drip 1.1s ease-in infinite}
.go .m-smile{display:none}.go .m-frown{display:inline}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
document.querySelectorAll('.card').forEach(c=>{
  const b=c.querySelector('.btn'),on=()=>c.classList.add('go'),off=()=>c.classList.remove('go');
  ['mouseenter','focus','touchstart'].forEach(e=>b.addEventListener(e,on,{passive:true}));
  ['mouseleave','blur','touchend','touchcancel'].forEach(e=>b.addEventListener(e,off));
});
</script>
