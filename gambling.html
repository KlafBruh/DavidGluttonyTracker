<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gambling Losses Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050505;--card:#0f0d14;--ink:#f6f2fb;--mute:#a79db8;--line:#2e2640;--lime:#a855f7;--red:#ff4d4d;--yel:#ffb703;--grn:#a855f7;--ring:#241b36;--hero:#0b0910;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
h1 span{color:var(--lime)}
.set{display:flex;gap:10px;flex-wrap:wrap}
.set label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
input,button,select{font:inherit;color:inherit}
input{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--lime);outline-offset:1px}
.set input{width:130px}
.card{background:var(--card);border-radius:22px;padding:20px;border:1.5px solid var(--line)}
.main{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.hero{text-align:center;background:var(--hero);box-shadow:0 0 70px rgba(168,85,247,.12);border-color:#3b2a5a}
.hero h2{margin:0;font-size:22px;font-weight:800}
.mood{color:var(--mute);margin:2px 0 4px}
svg.stage{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
#fig{transform-origin:200px 345px}
#prog{transition:stroke .4s}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pill{border-radius:16px;padding:10px 18px;background:var(--bg);min-width:130px}
.pill b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.pill small{color:var(--mute);font-size:13px}
.form h3,.sec h3{margin:0 0 12px;font-size:18px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{font-size:13px;color:var(--mute);display:block}
.form .full{grid-column:1/-1}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.quick button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.quick button:hover{border-color:var(--lime);color:var(--lime)}
.add{width:100%;margin-top:12px;background:var(--lime);color:#0a0a0a;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;cursor:pointer}
.add:active{transform:scale(.98)}
.note{font-size:12px;color:var(--mute);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border-radius:20px;padding:16px;background:var(--card);border:1.5px solid var(--line)}
.stat b{display:block;font-size:clamp(22px,4vw,32px);font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.stat.big{background:var(--lime);color:#0a0a0a;border-color:var(--lime)}
.stat.big span{color:#2b0f4d}
.stat.yel{background:#170f27;color:var(--lime);border-color:var(--lime)}
.stat.yel span{color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two.solo{grid-template-columns:1fr}
.main.solo{grid-template-columns:minmax(0,560px);justify-content:center}
[hidden]{display:none!important}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;position:relative;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute);gap:4px}
.bar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--lime);min-height:3px;transition:height .6s}
.bar i.over{background:var(--red)}
.bar em{font-style:normal;color:var(--ink);font-weight:600;font-size:11px}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--mute);pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--mute);background:var(--card);padding:0 4px}
.list{max-height:360px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--mute)}
.row .n{text-align:right;font-weight:600;white-space:nowrap}
.row .n small{display:block;color:var(--mute);font-weight:400}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer;border-radius:8px;width:32px;height:32px}
.x:hover{color:var(--red)}
.empty{color:var(--mute);padding:16px 0;text-align:center}
.empty button{margin-top:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 14px;cursor:pointer}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{border-color:var(--lime);color:var(--lime)}
.nav a.on{background:var(--lime);border-color:var(--lime);color:#0a0a0a}

.heroes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.heroes{grid-template-columns:1fr}}
.pill b.neg{color:var(--red)}
.pill b.pos{color:var(--lime)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Total <span>losses</span></h1>
  <nav class="nav"><a href="index.html">Home</a><a href="food.html">Food</a><a href="smoking.html">Smoking</a><a href="gambling.html" class="on">Gambling</a></nav>
</header>
<p class="note" id="access" style="margin:-6px 0 14px">Loading…</p>
<div class="heroes" id="heroes"></div>
<div class="stats" id="stats"></div>
<div class="two" id="two">
  <section class="card sec"><h3>Total losses over time</h3><div id="chart"></div></section>
  <section class="card sec"><h3>Bet history</h3><div class="list" id="list"></div></section>
</div>
</div>
<script>
// ---- Settings: edit these ----
const CONFIG={
  lossCap:100,   // the ring is full when they have lost this much combined
  players:[
    {name:'Søren', look:'ginger',   color:'#a855f7'},   // look: 'ginger' or 'greenhat'
    {name:'Gavin', look:'greenhat', color:'#e9d5ff'}
  ],
  csvUrl:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQo6KM3GmWnuKpDxqdtNeaLM2aZyxn6rR9GFHXU0_U_Ung_QcJfN9VfEI16QoiP__mCIuoNjtR62Dmi/pub?gid=1318187732&single=true&output=csv', // Google Sheet tab > Publish to web > CSV
  refreshMinutes:5
};

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m0=n=>{n=Math.abs(n);return '$'+(n%1?n.toFixed(2):Math.round(n).toLocaleString())};
const sum=(a,k)=>a.reduce((s,m)=>s+m[k],0);
const key=s=>String(s||'').toLowerCase().replace(/ø/g,'o').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const nice=d=>{const [y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const PLAYERS=CONFIG.players.map((p,i)=>Object.assign({i,key:key(p.name)},p));
let S={logs:[]};

function parseCSV(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
function normDate(v){v=(v||'').trim();let m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+pad(+m[1])+'-'+pad(+m[2]);
  const d=new Date(v);return isNaN(d)?'':ds(d)}
const numv=v=>{let s=String(v||'').trim();const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/^\$-/.test(s);const n=parseFloat(s.replace(/[^0-9.]/g,''))||0;return neg?-n:n};
function fromCSV(text){
  const rows=parseCSV(text).filter(r=>r.some(x=>x.trim()));
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  const [iD,iP,iA,iN]=['date','player','amount','note'].map(k=>h.indexOf(k));
  return rows.map((r,n)=>{const a=numv(r[iA]);
    return{id:n,date:normDate(r[iD]),key:key(r[iP]),who:(r[iP]||'').trim(),amount:a,loss:a<0?-a:0,win:a>0?a:0,note:iN<0?'':(r[iN]||'').trim()}}).filter(l=>l.date&&l.amount!==0)}
function sample(){const out=[],a=[-40,25,-60,-25,-90,30,-45,-70,20,-35];
  a.forEach((v,i)=>{const x=new Date();x.setDate(x.getDate()-(9-i));const p=PLAYERS[i%PLAYERS.length];
    out.push({id:i,date:ds(x),key:p.key,who:p.name,amount:v,loss:v<0?-v:0,win:v>0?v:0,note:['Poker night','Sports bet','Blackjack'][i%3]})});
  return out}

// ---- Characters ----
const LOOKS={
 ginger:{skin:'#f1c9a5',shoe:'#7a5a3a',brace:'#111',
  back:`<ellipse cx="160" cy="168" rx="10" ry="18" fill="#c4491c"/><ellipse cx="240" cy="168" rx="10" ry="18" fill="#c4491c"/>`,
  legs:`<rect x="173" y="310" width="16" height="16" fill="#f1c9a5"/><rect x="211" y="310" width="16" height="16" fill="#f1c9a5"/><rect x="168" y="286" width="64" height="30" rx="10" fill="#161616"/>`,
  torso:`<ellipse cx="200" cy="248" rx="44" ry="58" fill="#a89a52"/><path d="M188 200 L212 200 L200 238Z" fill="#f3f6ee"/><circle cx="200" cy="248" r="2.5" fill="#5a5430"/><circle cx="200" cy="264" r="2.5" fill="#5a5430"/><circle cx="200" cy="280" r="2.5" fill="#5a5430"/>`,
  sleeve:'#a89a52',
  hair:`<g fill="#c4491c"><circle cx="164" cy="132" r="17"/><circle cx="182" cy="114" r="19"/><circle cx="206" cy="108" r="19"/><circle cx="228" cy="116" r="18"/><circle cx="240" cy="136" r="15"/></g><g fill="#d9622b"><circle cx="190" cy="118" r="8"/><circle cx="222" cy="122" r="7"/></g>`,
  extra:`<g fill="#c98f6a"><circle cx="176" cy="168" r="1.6"/><circle cx="184" cy="172" r="1.6"/><circle cx="224" cy="168" r="1.6"/><circle cx="216" cy="173" r="1.6"/><circle cx="200" cy="164" r="1.4"/></g>`},
 greenhat:{skin:'#f3d2b8',shoe:'#cfd6c6',brace:'#e8edf5',
  back:`<ellipse cx="158" cy="160" rx="12" ry="22" fill="#b183d6"/><ellipse cx="242" cy="160" rx="12" ry="22" fill="#8fc9d9"/>`,
  legs:`<rect x="168" y="286" width="64" height="40" rx="12" fill="#1f7a2e"/>`,
  torso:`<ellipse cx="200" cy="248" rx="44" ry="58" fill="#141414"/><path d="M188 252 q12 -30 24 0 q-12 26 -24 40" fill="none" stroke="#6e7480" stroke-width="3"/>`,
  sleeve:'#141414',
  hair:`<path d="M158 138 Q172 150 192 140 Q204 152 222 140 Q236 150 244 138 Q244 128 200 126 Q156 128 158 138Z" fill="#b183d6"/><path d="M200 130 Q222 150 244 138 Q244 128 200 126Z" fill="#8fc9d9"/><path d="M152 130 Q150 80 200 80 Q250 80 248 130 Z" fill="#7dff2a"/><rect x="146" y="126" width="108" height="12" rx="6" fill="#5fd11a"/><rect x="172" y="98" width="56" height="5" rx="2" fill="#0a0a0a"/><rect x="180" y="108" width="40" height="5" rx="2" fill="#0a0a0a"/>`,
  extra:`<path d="M188 202 Q200 230 212 202" fill="none" stroke="#cfd6c6" stroke-width="2.5"/><rect x="198" y="226" width="4" height="15" fill="#e8edf5"/><rect x="193" y="231" width="14" height="4" fill="#e8edf5"/><circle cx="170" cy="168" r="2.2" fill="#cfd6c6"/><circle cx="230" cy="168" r="2.2" fill="#cfd6c6"/><circle cx="214" cy="166" r="2" fill="#cfd6c6"/>`}
};
function figureHTML(p,cx){const i=p.i,L=LOOKS[p.look]||LOOKS.ginger;
 return `<g transform="translate(${cx} 318) scale(.8) translate(-200 -345)"><g id="fig${i}" style="transform-origin:200px 345px">
   <ellipse cx="200" cy="348" rx="60" ry="9" fill="#a855f7" opacity=".14"/>
   ${L.legs}
   <ellipse cx="181" cy="326" rx="19" ry="12" fill="${L.shoe}"/><ellipse cx="219" cy="326" rx="19" ry="12" fill="${L.shoe}"/>
   ${L.torso}
   <ellipse cx="152" cy="250" rx="11" ry="38" fill="${L.sleeve}" transform="rotate(10 152 250)"/>
   <ellipse cx="248" cy="250" rx="11" ry="38" fill="${L.sleeve}" transform="rotate(-10 248 250)"/>
   <circle cx="148" cy="284" r="10" fill="${L.skin}"/><circle cx="252" cy="284" r="10" fill="${L.skin}"/>
   <circle cx="149" cy="277" r="8.5" fill="none" stroke="${L.brace}" stroke-width="4" stroke-dasharray="3 2"/>
   <circle cx="251" cy="277" r="8.5" fill="none" stroke="${L.brace}" stroke-width="4" stroke-dasharray="3 2"/>
   ${L.back}
   <rect x="190" y="196" width="20" height="18" rx="7" fill="${L.skin}"/>
   <circle cx="200" cy="152" r="44" fill="${L.skin}"/>
   ${L.hair}${L.extra}
   <ellipse id="eL${i}" cx="184" cy="156" rx="5" ry="7" fill="#0b0705"/><ellipse id="eR${i}" cx="216" cy="156" rx="5" ry="7" fill="#0b0705"/>
   <path id="mouth${i}" d="M184 172 Q200 188 216 172" fill="none" stroke="#1a0d08" stroke-width="4" stroke-linecap="round"/>
   <ellipse id="drop${i}" cx="238" cy="150" rx="3.5" ry="5.5" fill="#6ec1ff" opacity="0"/>
  </g></g>`}
$('heroes').innerHTML=`<section class="card hero" style="grid-column:1/-1;width:100%;max-width:600px;justify-self:center"><h2>${PLAYERS.map(p=>esc(p.name)).join(' &amp; ')}</h2><p class="mood" id="mood"></p>
 <svg class="stage" viewBox="0 0 400 400" role="img" aria-label="${PLAYERS.map(p=>esc(p.name)).join(' and ')} in a ring showing combined losses">
  <circle cx="200" cy="200" r="168" fill="none" stroke="var(--ring)" stroke-width="16"/>
  <circle id="prog" cx="200" cy="200" r="168" fill="none" stroke="#a855f7" stroke-width="16" stroke-linecap="round" transform="rotate(-90 200 200)" stroke-dasharray="1055.6" stroke-dashoffset="1055.6"/>
  ${PLAYERS.map((p,i)=>figureHTML(p,[142,258][i]||200)).join('')}
 </svg>
 <div class="pills"><div class="pill"><b id="lost">$0</b><small>combined total lost</small></div><div class="pill"><b id="net">$0</b><small>combined net (wins minus losses)</small></div></div></section>`;


// ---- Tween engine ----
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ease={outCubic:t=>1-Math.pow(1-t,3)};
const cur={ring:0,lost:0},raf={},br={};PLAYERS.forEach(p=>br[p.i]=0);
let nextBlink=2500,blinkStart=-1;
const MN=[[184,172,200,188,216,172],[186,174,200,182,214,174],[186,178,200,178,214,178],[184,182,200,168,216,182]];
const mc={},mraf={};PLAYERS.forEach(p=>mc[p.i]=MN[0].slice());
function apply(){
  $('prog').style.strokeDashoffset=1055.6*(1-cur.ring);
  $('lost').textContent=m0(cur.lost);
  PLAYERS.forEach(p=>$('fig'+p.i).style.transform=`scale(${(1+0.012*br[p.i]).toFixed(4)},${(1-0.02*br[p.i]-0.14*cur.ring).toFixed(4)})`)}
function tweenTo(k,to,ms){
  cancelAnimationFrame(raf[k]);const from=cur[k],t0=performance.now(),d=RM?1:ms;
  (function step(now){const p=Math.min((now-t0)/d,1);cur[k]=from+(to-from)*ease.outCubic(p);apply();if(p<1)raf[k]=requestAnimationFrame(step)})(t0)}
function moveMouth(i,m){
  cancelAnimationFrame(mraf[i]);const f=mc[i].slice(),to=MN[m],t0=performance.now();
  (function s(now){const p=Math.min((now-t0)/(RM?1:500),1),e=ease.outCubic(p);
    mc[i]=f.map((v,k)=>v+(to[k]-v)*e);const a=mc[i];
    $('mouth'+i).setAttribute('d',`M${a[0]} ${a[1]} Q${a[2]} ${a[3]} ${a[4]} ${a[5]}`);
    if(p<1)mraf[i]=requestAnimationFrame(s)})(t0)}
function idle(t){
  let k=1;
  if(!RM){
    if(blinkStart<0&&t>nextBlink)blinkStart=t;
    if(blinkStart>=0){const p=(t-blinkStart)/170;if(p>=1){blinkStart=-1;nextBlink=t+2500+Math.random()*3000}else k=1-0.9*Math.sin(Math.PI*p)}}
  PLAYERS.forEach(p=>{const i=p.i,ry=(7*k).toFixed(2);
    br[i]=RM?0:Math.sin(t/650+i*1.3);
    $('eL'+i).setAttribute('ry',ry);$('eR'+i).setAttribute('ry',ry);
    const ph=((t/1500)+i*.4)%1,sad=cur.ring>.3&&!RM;
    $('drop'+i).setAttribute('cy',(152+ph*46).toFixed(1));$('drop'+i).setAttribute('opacity',sad?((1-ph)*.9).toFixed(2):0)});
  apply();requestAnimationFrame(idle)}
requestAnimationFrame(idle);

function mood(r){
  if(r<.05)return['Still have their money.',0];
  if(r<.25)return['A few small losses.',0];
  if(r<.6)return['Starting to feel it.',1];
  if(r<1)return['Wallets are crying.',2];
  return['Rock bottom.',3]}
function render(){
  const all=S.logs,rows=p=>all.filter(l=>l.key===p.key);
  const tlc=sum(all,'loss'),ratio=tlc/CONFIG.lossCap,[mt,mi]=mood(ratio);
  $('mood').textContent=mt;tweenTo('ring',Math.min(ratio,1),1100);tweenTo('lost',tlc,1100);PLAYERS.forEach(p=>moveMouth(p.i,mi));
  $('prog').style.stroke=ratio>.9?'#ff4d4d':ratio>.5?'#ffb703':'#a855f7';
  const nt=sum(all,'win')-tlc,nel=$('net');nel.textContent=(nt<0?'−':nt>0?'+':'')+m0(nt);nel.className=nt<0?'neg':nt>0?'pos':'';
  const tl=sum(all,'loss'),tw=sum(all,'win'),net=tw-tl,days=[...new Set(all.map(l=>l.date))];
  const worst=days.length?Math.max(...days.map(d=>sum(all.filter(l=>l.date===d),'loss'))):0;
  const big=all.length?Math.max(...all.map(l=>l.loss)):0;
  const wins=all.filter(l=>l.win>0).length;
  $('stats').innerHTML=`<div class="stat big"><b>${m0(tl)}</b><span>Combined total lost</span></div>`+
   PLAYERS.map(p=>`<div class="stat"><b>${m0(sum(rows(p),'loss'))}</b><span>${esc(p.name)} total lost</span></div>`).join('')+
   `<div class="stat yel"><b>${net<0?'−':net>0?'+':''}${m0(net)}</b><span>Net result</span></div>
    <div class="stat"><b>${m0(big)}</b><span>Biggest single loss</span></div>
    <div class="stat"><b>${all.length}</b><span>Bets logged</span></div>
    <div class="stat"><b>${all.length?Math.round(wins/all.length*100):0}%</b><span>Win rate</span></div>
    <div class="stat"><b>${m0(worst)}</b><span>Worst day</span></div>`;
  chart(all);
  const L=[...all].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('list').innerHTML=L.length?L.map(l=>`<div class="row"><div class="t"><b>${esc(l.who)}</b><small>${esc(l.note||'Bet')} · ${nice(l.date)}</small></div><div class="n" style="color:${l.amount<0?'var(--red)':'var(--lime)'}">${l.amount<0?'−':'+'}${m0(l.amount)}</div></div>`).join(''):`<div class="empty">No bets logged yet.</div>`}
function chart(all){
  if(!all.length){$('chart').innerHTML='<div class="empty">No bets logged yet.</div>';return}
  const dates=[...new Set(all.map(l=>l.date))].sort(),W=600,H=230,n=dates.length;
  const ser=PLAYERS.map(p=>{let c=0;return dates.map(d=>{c+=sum(all.filter(l=>l.date===d&&l.key===p.key),'loss');return c})});
  const mx=Math.max(1,...ser.flat()),X=i=>40+(n>1?i/(n-1):.5)*(W-60),Y=v=>H-34-v/mx*(H-60);
  let g=[0,.5,1].map(f=>`<line x1="40" x2="${W-20}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--line)"/><text x="34" y="${Y(mx*f)+4}" text-anchor="end" font-size="11" style="fill:var(--mute)">${m0(mx*f)}</text>`).join('');
  PLAYERS.forEach((p,pi)=>{const pts=ser[pi].map((v,i)=>X(i)+','+Y(v)).join(' ');
    g+=(n>1?`<polyline points="${pts}" fill="none" stroke="${p.color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`:'')+`<circle cx="${X(n-1)}" cy="${Y(ser[pi][n-1])}" r="5" fill="${p.color}"/>`});
  g+=`<text x="40" y="${H-12}" font-size="11" style="fill:var(--mute)">${nice(dates[0])}</text><text x="${W-20}" y="${H-12}" text-anchor="end" font-size="11" style="fill:var(--mute)">${nice(dates[n-1])}</text>`;
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Cumulative losses over time">${g}</svg><div class="pills" style="margin-top:4px">${PLAYERS.map(p=>`<small style="color:var(--mute)"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.color};margin-right:6px"></span>${esc(p.name)}</small>`).join('')}</div>`}
const status=t=>{$('access').textContent=t};
async function load(){
  if(!CONFIG.csvUrl||CONFIG.csvUrl.startsWith('PASTE')){S.logs=sample();status('Showing sample data. Paste your published sheet link into CONFIG to use real data.');render();return}
  try{
    const res=await fetch(CONFIG.csvUrl+(CONFIG.csvUrl.includes('?')?'&':'?')+'t='+Date.now());
    if(!res.ok)throw 0;
    S.logs=fromCSV(await res.text());
    status('Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'. New bets can take a few minutes to appear.');
  }catch(e){status('Couldn’t load the sheet. Check that it is published to the web as CSV.')}
  render()}
load();setInterval(load,CONFIG.refreshMinutes*60000);
</script>
</body>
